apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stayon
  template:
    metadata:
      labels:
        app: stayon
    spec:
      containers:
        - name: stayon
          image: stayon-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: stayon-service
spec:
  type: NodePort
  selector:
    app: stayon
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
