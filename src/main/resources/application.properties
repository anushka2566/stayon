# Server Configuration
server.port=8000
spring.application.name=STAYON

# H2 File-Based Database (persists inside ./data/stayondb)
spring.datasource.url=jdbc:h2:file:./data/stayondb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Initialize tables automatically from schema.sql on startup
spring.sql.init.mode=always

# Enable H2 Web Console for college demo inspection (http://localhost:8000/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

